<!DOCTYPE html>

<html xml:lang="de" lang="de"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

<f:view>
    <h:head id="template-head">
        <title><ui:insert name="title">Orni-Trainer</ui:insert></title>
        <link rel="canonical" href="./welcome.jsf"/>
        <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
        <meta name="Description" content="Orni-Trainer"/>

        <!--
         | https://developers.google.com/web/tools/lighthouse/audits/has-viewport-meta-tag?utm_source=lighthouse&utm_medium=devtools
         +-->
        <meta name="viewport" content="width=device-width, initial-scale=1"/>

        <link rel="shortcut icon" type="image/x-icon" href="#{resource['images/favicon.ico']}"/>
        <h:outputStylesheet name="css/_style.css"/>
        <h:outputStylesheet name="css/_layout.css"/>
        <!-- page specific css e.g. for layouting -->
        <ui:insert name="css"/>
    </h:head>

    <h:body>
        <nav id="nav">
            <h:form id="navForm">
                <ui:insert name="nav"></ui:insert>
            </h:form>
        </nav>
        <main id="main">
            <h:form id="mainForm">
                <ui:insert name="main"></ui:insert>
            </h:form>
        </main>
    </h:body>
</f:view>
</html>
