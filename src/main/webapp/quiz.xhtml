<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>

<html lang="en"
      xmlns:h="jakarta.faces.html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <title>.</title>
</h:head>

<ui:composition template="/WEB-INF/templates/template.xhtml">
    <ui:define name="title">#{i18nText.ornitrain}</ui:define>

    <ui:define name="css">
        <h:outputStylesheet name="css/layouts/welcome.css"/>
    </ui:define>

    <ui:define name="main">
        <h1>#{i18nText.welcome}</h1>
        <h:outputLabel for="category" value="#{i18nText.category}"/>
        <h:selectOneMenu id="category" value="#{quizUiState.category}">
            <f:selectItems value="#{quizUiService.allCategories}" var="s" itemValue="#{s}"
                           itemLabel="#{i18nText['orc.cc.orni.trainer.Category.' += s.name()]}"/>
        </h:selectOneMenu>
        <h:outputLabel for="hint" value="#{i18nText.hint}"/>
        <h:selectOneMenu id="hint" value="#{quizUiState.hint}">
            <f:selectItems value="#{quizUiService.allHints}" var="s" itemValue="#{s}"
                           itemLabel="#{i18nText['orc.cc.orni.trainer.Hint.' += s.name()]}"/>
        </h:selectOneMenu>
        <hr/>
        <h:graphicImage library="birds" name="#{quizUiState.imageName}"
                        alt="#{quizUiState.imageName}"
                        rendered="#{quizUiState.imageHint}"
                        style="width: 500px; height: auto"/>
        <h:outputText value="#{quizUiState.bird.species}"
                      rendered="#{quizUiState.speciesHint}"/>
        <hr/>
        <h:commandButton value="#{i18nText.solution}" action="#{quizUiService.showSolution()}"/>
        <h:commandButton value="#{i18nText.correct}" action="#{quizUiService.correct()}"/>
        <h:commandButton value="#{i18nText.incorrect}" action="#{quizUiService.incorrect()}"/>
    </ui:define>
</ui:composition>
</html>
