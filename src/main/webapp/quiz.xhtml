<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>

<html lang="en"
      xmlns:h="jakarta.faces.html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:c="jakarta.tags.core"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <title>.</title>
</h:head>

<ui:composition template="/WEB-INF/templates/template.xhtml">
    <ui:define name="title">#{i18nText.ornitrain}</ui:define>

    <ui:define name="css">
        <h:outputStylesheet name="css/layouts/quiz.css"/>
    </ui:define>

    <ui:define name="main">
        <h1>#{i18nText.welcome}</h1>
        <h:outputLabel for="countBirdsLeft" value="Noch "/>
        <h:outputText id="countBirdsLeft" value="#{quizUiState.countBirdsLeft}"/>
        <div class="parent">
            <div class="div1">
                <!--
                 | settings
                 +-->
                <h:outputLabel for="category" value="#{i18nText.category}"/>
                <h:selectOneMenu id="category" value="#{quizUiState.category}">
                    <f:selectItems value="#{quizUiService.allCategories}" var="s" itemValue="#{s}"
                                   itemLabel="#{i18nText['orc.cc.orni.trainer.Category.' += s.name()]}"/>
                </h:selectOneMenu>
                <h:outputLabel for="hint" value="#{i18nText.hint}"/>
                <h:selectOneMenu id="hint" value="#{quizUiState.hint}">
                    <f:selectItems value="#{quizUiService.allHints}" var="s" itemValue="#{s}"
                                   itemLabel="#{i18nText['orc.cc.orni.trainer.Hint.' += s.name()]}"/>
                    <f:ajax event="click" listener="#{quizUiService.selectHint}"/>
                </h:selectOneMenu>
            </div>
            <div class="div2">
                <!--
                 | hints
                 +-->
                <h:graphicImage library="birds" name="#{quizUiState.imageName}"
                                rendered="#{quizUiState.imageHint}"
                                alt="#{quizUiState.imageName}"
                                style="width: 500px; height: auto"/>
                <h:outputText value="#{quizUiState.bird.species}"
                              rendered="#{quizUiState.speciesHint}"/>


                <c:if test="#{quizUiState.soundHint}">
                    <audio controls="controls" autoplay="autoplay">
                        <source src="#{resource[quizUiState.soundName]}"/>
                    </audio>
                </c:if>
            </div>
            <div class="div3">
                <!--
                 | solution
                 +-->
                <table>
                    <tr>
                        <td><h:outputLabel for="ordnung" value="#{i18nText.order}"/></td>
                        <td><h:outputText id="ordnung"
                                          value="#{quizUiState.bird.order} (#{i18nText[quizUiState.bird.order]})"
                                          rendered="#{quizUiState.showResolution}"/></td>
                    </tr>
                    <tr>
                        <td><h:outputLabel for="familie" value="#{i18nText.family}"/></td>
                        <td><h:outputText id="familie"
                                          value="#{quizUiState.bird.family} (#{i18nText[quizUiState.bird.family]})"
                                          rendered="#{quizUiState.showResolution}"/></td>
                    </tr>
                    <tr>
                        <td><h:outputLabel for="species" value="#{i18nText.species}"/></td>
                        <td><h:outputText id="species"
                                          value="#{quizUiState.bird.species} (#{i18nSpecies[quizUiState.bird.species]})"
                                          rendered="#{quizUiState.showResolution}"/>
                        </td>
                    </tr>
                    <tr>
                        <td><h:outputLabel for="habitat" value="#{i18nText.habitat}"/></td>
                        <td><h:outputText id="habitat"
                                          value="#{quizUiState.bird.habitat}"
                                          rendered="#{quizUiState.showResolution}"/>
                        </td>
                    </tr>
                </table>
            </div>
            <div class="div4">
                <!--
                 | action
                 +-->
                <h:commandButton value="#{i18nText.solution}" action="#{quizUiService.showSolution()}"/>
                <h:commandButton value="#{i18nText.correct}" action="#{quizUiService.correct()}"/>
                <h:commandButton value="#{i18nText.incorrect}" action="#{quizUiService.incorrect()}"/>
            </div>
        </div>
    </ui:define>
</ui:composition>
</html>
